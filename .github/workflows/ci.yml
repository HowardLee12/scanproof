name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1

  s3-integration:
    runs-on: ubuntu-latest
    services:
      rustfs:
        # An S3-compatible server, pinned by digest.
        image: rustfs/rustfs@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
        ports: ["9000:9000"]
        env:
          RUSTFS_ACCESS_KEY: scanproof
          RUSTFS_SECRET_KEY: scanproof-test-pw
    env:
      SCANPROOF_S3_TEST_ENDPOINT: http://localhost:9000
      AWS_ACCESS_KEY_ID: scanproof
      AWS_SECRET_ACCESS_KEY: scanproof-test-pw
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Wait for the S3 server
        run: for i in $(seq 1 30); do curl -s -o /dev/null localhost:9000 && exit 0; sleep 2; done; exit 1
      - run: go test -run TestS3StoreAgainstRealService -v ./internal/store/

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg VERSION=ci-${{ github.sha }} -t scanproof:ci .
      - name: Scan a known-vulnerable image end to end
        run: |
          mkdir -p out store trivy-cache
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/out:/out" -v "$PWD/store:/store" -v "$PWD/trivy-cache:/root/.cache/trivy" \
            scanproof:ci scan --out /out --store file:///store alpine:3.18.0
          test -s out/report.pdf && test -s out/results.json && test -s out/sbom.cdx.json && test -s out/manifest.json
      - name: Rescan the running image from its stored SBOM
        run: |
          digest=$(jq -r .image.digest out/results.json)
          echo "alpine:3.18.0@${digest}" > out/images.txt
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/out:/out" -v "$PWD/store:/store" -v "$PWD/trivy-cache:/root/.cache/trivy" \
            scanproof:ci rescan --store file:///store --inventory file --images-file /out/images.txt --out /out/rescan
          grep -l '"method": "sbom"' out/rescan/*/results.json
      - name: Scan a directory and rescan it from its stored SBOM
        run: |
          meta=dir/venv/lib/python3.12/site-packages/urllib3-1.26.4.dist-info
          mkdir -p "$meta"
          printf 'Metadata-Version: 2.1\nName: urllib3\nVersion: 1.26.4\n' > "$meta/METADATA"
          docker run --rm -v "$PWD/dir:/scan/dir:ro" -v "$PWD/out:/out" -v "$PWD/store:/store" -v "$PWD/trivy-cache:/root/.cache/trivy" \
            scanproof:ci scan --dir --name example-venv --version 1 --out /out/dir --store file:///store /scan/dir
          jq -e '.artifact_type == "directory" and any(.vulnerabilities[]; .package == "urllib3")' out/dir/results.json
          test -s out/dir/report.pdf && test -s out/dir/sbom.cdx.json
          echo "dir:example-venv:1@$(jq -r .directory.tree_digest out/dir/results.json) ci-runner" > out/dirs.txt
          docker run --rm -v "$PWD/out:/out" -v "$PWD/store:/store" -v "$PWD/trivy-cache:/root/.cache/trivy" \
            scanproof:ci rescan --store file:///store --inventory file --images-file /out/dirs.txt --out /out/dir-rescan
          jq -e '.artifact_type == "directory" and .runtime.method == "sbom" and any(.vulnerabilities[]; .package == "urllib3")' \
            out/dir-rescan/*/results.json
      - name: Every planted secret in a directory is reported or listed as not checked
        # Checks the coverage model and the switched-off allow rules against
        # the real Trivy: each file below holds a GitHub token. Files Trivy
        # reads must be reported; the others must be listed in
        # directory.coverage. The token is assembled here, so no
        # token-shaped string is committed. Trivy accepts unknown allow-rule
        # IDs silently, so each ID ScanProof switches off has a file that
        # only that rule would hide:
        #   tests       pkg/tests/conftest.py     examples    examples/demo.py
        #   markdown    README.md                 locale-dir  pkg/locale/de/messages.po
        #   vendor      pkg/vendor/lib.py         usr-dirs    usr/share/doc/notes.txt,
        #                                                     usr/include/a.h, usr/lib/x/a.txt
        #   python      usr/local/lib/python3.12/site.py
        #   golang      usr/local/go/src/a.go     node.js     opt/yarn-v1.22.19/lib/cli.js
        #   rubygems    usr/lib/gems/2.7/a.rb     wordpress   usr/src/wordpress/wp-config.php
        # (usr/lib/gems is also under usr-dirs; with both rules off it is read.)
        run: |
          tok="ghp_$(printf 'S%.0s' $(seq 36))"
          read_paths="app/settings.py vendor/top.py trivy-secret.yaml
            pkg/tests/conftest.py examples/demo.py README.md pkg/locale/de/messages.po pkg/vendor/lib.py
            usr/share/doc/notes.txt usr/include/a.h usr/lib/x/a.txt usr/local/lib/python3.12/site.py
            usr/local/go/src/a.go opt/yarn-v1.22.19/lib/cli.js usr/lib/gems/2.7/a.rb usr/src/wordpress/wp-config.php"
          unread_paths="src/plugin/.git/config dev/creds.txt web/node_modules/left-pad/index.js package-lock.json
            go.sum model.bin archive.zip native.so"
          for p in $read_paths $unread_paths; do
            mkdir -p "planted/$(dirname "$p")"
            printf 'token = "%s"\n' "$tok" > "planted/$p"
          done
          printf '\177ELF\002\001\001\000 token = "%s"\n' "$tok" > planted/native.so
          # tiny only tests that files under 10 bytes are left out of the
          # model: no secret rule fits in them, so they are neither reported
          # nor listed.
          printf 'ghp_x' > planted/tiny
          docker run --rm -v "$PWD/planted:/scan/planted:ro" -v "$PWD/out:/out" -v "$PWD/trivy-cache:/root/.cache/trivy" \
            scanproof:ci scan --dir --name planted --out /out/planted --pdf=false --sbom=false /scan/planted
          r=out/planted/results.json
          for p in $read_paths; do
            jq -e --arg p "$p" 'any(.secrets[]; .target == $p)' "$r" > /dev/null || { echo "not reported: $p"; exit 1; }
          done
          for p in $unread_paths; do
            jq -e --arg p "$p" 'any(.secrets[]; .target == $p) | not' "$r" > /dev/null || { echo "read after all: $p"; exit 1; }
            jq -e --arg p "$p" '.directory.coverage | any(.secrets_not_checked.paths[]; .path == $p)
              or any(.not_scanned.paths[]; .path as $root | $p == $root or ($p | startswith($root + "/")))' "$r" > /dev/null \
              || { echo "not listed as not checked: $p"; exit 1; }
          done
          # Under 10 bytes is too small for any secret rule: neither read nor listed.
          jq -e 'any(.secrets[]; .target == "tiny") or any(.directory.coverage.secrets_not_checked.paths[]; .path == "tiny") | not' "$r"
      - name: Build a period summary from the stored scan
        run: |
          today=$(date -u +%F)
          docker run --rm -v "$PWD/out:/out" -v "$PWD/store:/store" \
            scanproof:ci report --store file:///store --from "$today" --to "$today" --out /out/summary
          test -s out/summary/summary.pdf && test -s out/summary/population.csv
      - name: Build the full image without downloading ClamAV signatures
        run: docker build --target full --build-arg CLAMAV_DB=none -t scanproof:ci-full .
      - name: Malware scan finds a test file
        run: |
          mkdir -p mal/ctx
          printf '%s' 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > mal/ctx/eicar.com
          printf 'FROM alpine:3.20\nCOPY eicar.com /app/tests/eicar.com\n' > mal/ctx/Dockerfile
          docker build -t scanproof-test/eicar:ci mal/ctx
          # A one-line signature instead of the full ClamAV database, so CI
          # never downloads from the ClamAV mirrors.
          hex=$(printf 'EICAR-STANDARD-ANTIVIRUS-TEST-FILE' | od -An -tx1 | tr -d ' \n')
          echo "ScanProof.Test.EICAR:0:*:${hex}" > mal/test.ndb
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/mal:/mal" -v "$PWD/trivy-cache:/root/.cache/trivy" \
            scanproof:ci-full scan --malware --clamav-db /mal/test.ndb --out /mal/out -- scanproof-test/eicar:ci
          jq -e '.malware.findings | length == 1 and .[0].path == "/app/tests/eicar.com"' mal/out/results.json
          test -s mal/out/report.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: sample-evidence
          path: |
            out/
            mal/out/
