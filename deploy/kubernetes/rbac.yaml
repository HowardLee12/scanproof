# Lets the ScanProof rescan job list running pods. It can read nothing else.
apiVersion: v1
kind: Namespace
metadata:
  name: scanproof
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scanproof-rescan
  namespace: scanproof
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scanproof-rescan
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scanproof-rescan
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: scanproof-rescan
subjects:
  - kind: ServiceAccount
    name: scanproof-rescan
    namespace: scanproof
